<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ショート動画エディタ</title>
<style>
  :root {
    /* インスタコンセプト設計ツールと同じ配色（パステル×コーラルCTAの温かいライトテーマ） */
    --bg: #FDFCFA;
    --surface: #FFFFFF;
    --surface-2: #FAFAF7;
    --surface-3: #FFFFFF;
    --surface-4: #F5F2EB;
    --border: #EDEAE4;
    --border-soft: #F0EDE7;
    --border-strong: #E3E0D9;
    --text: #4A4A5A;
    --text-muted: #8A8A9A;
    --text-faint: #B5B5C0;
    --accent: #7EB8E6;
    --accent-hover: #5FA6DE;
    --accent-soft: #EAF4FC;
    --coral: #FF9E9E;
    --danger: #F08080;
    --danger-soft: #FFF0F0;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    letter-spacing: 0.01em;
  }

  /* ── 左パネル ──────────────────────────── */
  #leftPanel {
    width: 380px;
    flex-shrink: 0;
    background: var(--bg);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    height: 100vh;
  }
  #leftPanel > *:not(#videoWrap) {
    align-self: stretch;
  }
  #totalDuration {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 14px;
    text-align: center;
    letter-spacing: 0.04em;
  }
  #totalDuration .value {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    margin-left: 6px;
    letter-spacing: 0;
  }
  #videoWrap {
    position: relative;
    flex-shrink: 0;
    width: min(100%, calc((100vh - 220px) * 9 / 16));
    aspect-ratio: 9 / 16;
    margin: 0 auto;
    background: #000;
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  #previewVideo {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #playIcon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 44px;
    color: rgba(255,255,255,0.9);
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  #playIcon.hidden { display: none; }
  #loadingOverlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff; text-align: center;
    pointer-events: none;
    padding: 0 20px;
  }
  #loadingOverlay.show { display: flex; }
  #loadingOverlay .spin { font-size: 30px; animation: spin 1.1s linear infinite; }
  #loadingOverlay .big { font-size: 15px; font-weight: 700; }
  #loadingOverlay .small { font-size: 12px; opacity: 0.85; line-height: 1.5; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .title-input {
    width: 100%;
    background: #ffffff;
    color: #4A4A5A;
    border: 1px solid #E3E0D9;
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .title-input:focus { outline: none; border-color: var(--accent); }
  .title-typewriter-toggle {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
  }
  .title-typewriter-toggle input[type=checkbox] { accent-color: var(--accent); }

  .actions {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border: 1.5px solid var(--border-strong);
    background: var(--surface-3);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
    color: var(--text);
    transition: background-color 0.12s ease, border-color 0.12s ease;
  }
  button:hover { background: var(--surface-4); border-color: #C9C4BA; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-danger {
    background: transparent;
    border-color: transparent;
    color: var(--danger);
  }
  .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger-soft); }
  .btn-accent-outline {
    background: transparent;
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-accent-outline:hover { background: var(--accent-soft); }
  .btn-blue {
    background: linear-gradient(90deg, var(--coral), #FFB88E);
    border: none;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    padding: 12px 18px;
    letter-spacing: 0.02em;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(255, 158, 158, 0.4);
    transition: transform 0.15s;
  }
  .btn-blue:hover { background: linear-gradient(90deg, var(--coral), #FFB88E); transform: translateY(-1px) scale(1.02); }
  button:disabled { opacity: 0.45; cursor: default; }
  #status { font-size: 12px; color: var(--text-muted); margin-top: 10px; min-height: 16px; }

  /* ── 右パネル全体 ──────────────────────── */
  #rightPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  #rightHeader {
    flex-shrink: 0;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }
  .right-title-area {
    flex: 1;
    min-width: 0;
  }
  .right-title-area > label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  /* ── カード一覧 ──────────────────────── */
  #cardPanel {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: var(--bg);
  }
  .card {
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .card-num {
    display: inline-block;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent), #9ED2F0);
    border-radius: 999px;
    padding: 2px 11px;
    font-size: 13px;
    text-decoration: none !important;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-num:hover { filter: brightness(0.95); }
  .card-text {
    width: 50%;
    background: #ffffff;
    color: #4A4A5A;
    border: 1px solid #E3E0D9;
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
    overflow: hidden;
    line-height: 1.5;
  }
  .card-text:focus { outline: none; border-color: var(--accent); }
  .card-text::placeholder { color: #C0C0C0; font-style: italic; }  /* テロップ見本: 薄いグレー・修正前提 */
  .card-text-row { display: flex; gap: 14px; align-items: flex-start; margin-top: 8px; }
  .card-text-row .card-text { flex: 0 0 38%; width: auto; margin: 0; }
  .header-controls { display: flex; align-items: center; gap: 14px; margin-left: auto; flex-wrap: wrap; row-gap: 6px; }
  /* テロップ入力欄と装飾ボタンを横並びにして、入力欄の右の余白を使い切る */
  .card-text-area { display: flex; align-items: flex-start; gap: 16px; margin-top: 8px; }
  .card-text-full { flex: 0 0 46%; min-width: 260px; margin-top: 0; }
  .card-controls-below { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .card-side-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    row-gap: 8px;
  }
  .clip-row {
    margin-top: 8px;
    display: flex;
    align-items: stretch;
    gap: 12px;
  }
  .clip-thumb-md {
    width: 130px;
    aspect-ratio: 9 / 16;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #000;
    cursor: pointer;
  }
  .clip-info {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
    word-break: break-all;
  }
  .clip-actions {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: flex-start;
    min-width: 0;
  }
  .clip-actions .card-foot { margin-top: auto; }
  .clip-actions-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .clip-actions-buttons button { font-size: 13px; padding: 9px 14px; }
  .clip-actions-buttons select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13px;
    padding: 9px;
  }
  .trim-row {
    display: none;
    align-items: center;
    gap: 10px;
  }
  .trim-row.open { display: flex; }
  .trim-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }
  .trim-row span { font-size: 11px; color: var(--text-muted); min-width: 70px; }

  .clip-block {
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 10px;
    margin-top: 8px;
    background: var(--surface-2);
  }
  .clip-block .cut-label {
    display: inline-block;
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 600;
    background: var(--surface-3);
    border-radius: 4px;
    padding: 1px 6px;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  .card-foot {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .card-foot button, .card-foot select { font-size: 13px; padding: 9px 14px; }
  .card-foot select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  }
  .card-foot .btn-danger { margin-left: auto; }
  .note { font-size: 11px; color: var(--text-faint); margin-top: 8px; line-height: 1.5; }
  .zoom-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .btn-zoom { font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm);
    background: var(--surface-3); border: 1px solid var(--border-strong);
    color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .btn-zoom.active { background: #FFF9E8; border-color: #D9A93E; color: #C29438; }
  .zoom-vol { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 11px; color: var(--text-muted); }
  .zoom-vol input[type=range] { width: 70px; accent-color: var(--accent); }
  .zoom-vol input[type=number] { width: 44px; font-size: 11px; padding: 2px 4px; text-align: right;
    background: var(--surface-3); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); color: var(--text); font-family: inherit; }

  .sfx-row {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .sfx-row button { font-size: 12px; padding: 5px 10px; white-space: nowrap; }

  /* カスタム効果音ピッカー */
  .sfx-picker { position: relative; width: 200px; flex-shrink: 0; }
  .sfx-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    padding: 5px 8px; font-size: 12px; cursor: pointer; user-select: none;
    background: var(--surface-3); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); color: var(--text);
  }
  .sfx-trigger-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .sfx-dropdown {
    position: fixed; top: 0; left: 0;
    width: 780px; max-height: 360px; overflow-y: auto;
    background: var(--surface-2); border: 1px solid var(--border-strong);
    border-radius: var(--radius-md); z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    display: none;
  }
  .sfx-dropdown.open { display: block; }
  .sfx-group-label {
    padding: 6px 10px 3px; font-size: 11px; color: var(--text-faint);
    grid-column: 1 / -1;
  }
  .sfx-items-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px 6px 6px;
  }
  .sfx-none-row { padding: 6px 10px 4px; }
  .sfx-item {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 6px; cursor: pointer; font-size: 12px;
    border-radius: var(--radius-sm);
  }
  .sfx-item:hover { background: var(--surface-3); }
  .sfx-item.active { color: var(--accent); }
  .sfx-play-btn {
    flex-shrink: 0; font-size: 10px; padding: 2px 5px;
    background: var(--surface-4); border: 1px solid var(--border-strong);
    border-radius: 4px; cursor: pointer; color: var(--text-muted);
    line-height: 1.4;
  }
  .sfx-play-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .sfx-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sfx-vol { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 11px; color: var(--text-muted); }
  .sfx-vol input[type=range] { width: 70px; accent-color: var(--accent); }
  .sfx-vol input[type=number] { width: 44px; font-size: 11px; padding: 2px 4px; text-align: right;
    background: var(--surface-3); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); color: var(--text); font-family: inherit; }

  .undo-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 12px 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    z-index: 50;
  }
  .undo-toast.hidden { display: none; }
  .undo-toast button { padding: 6px 12px; }
  /* リール間コピー: カード秒数の数字入力・お手本ボタン */
  .dur-edit { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-muted); }
  .dur-input { width: 56px; font-size: 13px; padding: 3px 6px; text-align: right;
    border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .dur-input:focus { outline: none; border-color: var(--accent); }
  .btn-ref { font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: #F3F7FF; color: #3A6FB0; cursor: pointer; }
  .btn-ref:hover { filter: brightness(0.97); }
  .split-ctrl { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--text-muted); }
  .split-n { width: 40px; font-size: 12px; padding: 3px 4px; text-align: right;
    border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .btn-split { font-size: 12px; padding: 4px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: #FFF6F2; color: #C2694A; cursor: pointer; }
  .btn-split:hover { filter: brightness(0.97); }
  .btn-split-auto { font-size: 12px; padding: 4px 12px; border-radius: var(--radius-sm);
    border: 1px solid #E0A88E; background: #FFEDE3; color: #C2694A; font-weight: 600; cursor: pointer; }
  .btn-split-auto:hover { filter: brightness(0.97); }
  .split-manual { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>

<div id="leftPanel">
  <div id="totalDuration">想定再生時間<span class="value">--</span></div>
  <div id="videoWrap">
    <video id="previewVideo" playsinline></video>
    <img id="overlayPreview" style="position:absolute;display:none;pointer-events:none;transform:translate(-50%,-50%);">
    <div id="playIcon">▶</div>
    <div id="loadingOverlay">
      <div class="spin">⏳</div>
      <div class="big">プレビュー変換中…</div>
      <div class="small">この素材は初回だけ変換に数十秒かかります<br>（次からはすぐ表示されます）</div>
    </div>
  </div>
  <div id="status"></div>
  <div id="render-status" style="display:none;font-size:16px;font-weight:600;margin-bottom:6px;"></div>
  <div class="actions">
    <button class="btn-accent-outline" id="renderBtn" onclick="renderFinal()">今すぐ更新する</button>
    <button class="btn-accent-outline" onclick="showFinal()">完成版を確認</button>
  </div>
</div>

<div id="rightPanel">
  <div id="rightHeader">
    <div class="right-title-area">
      <label>タイトル（カード1に重ねて表示・任意）</label>
      <input type="text" id="panelTitleInput" class="title-input"
             placeholder="未入力ならカード1は通常のテロップのみ"
             oninput="onPanelTitleInput(this)" onchange="autosave()">
      <label class="title-typewriter-toggle">
        <input type="checkbox" id="panelTitleTypewriter" checked
               onchange="onPanelTitleTypewriterChange(this)"> 2行目をタイプライター表示
      </label>
    </div>
    <button class="btn-accent-outline" id="rescanBtn" style="white-space:nowrap;flex-shrink:0"
            onclick="rescanMaterials()"
            title="素材フォルダに追加した動画を読み込みます">🔄 動画素材フォルダを更新</button>
    <button class="btn-blue" style="white-space:nowrap;flex-shrink:0" onclick="exportReel()">⬇ 動画出力</button>
  </div>
  <div id="cardPanel"></div>
</div>

<div id="undoToast" class="undo-toast hidden">
  <span>カードを削除しました</span>
  <button class="btn-accent-outline" onclick="undoDeleteCard()">↩ 元に戻す</button>
</div>

<script>
let cards = [];
let materials = [];
let playUntil = null;
let currentPlayingFile = null;
let showingFinal = false;
let finalExists = false;  // final.mp4が存在するか（無ければ▶再生は素材プレビューにフォールバック）
let voiceoverEnd = 0;
let copyMode = false;   // リール間コピー: カード秒数を数字で直接編集＋お手本プレビューを出す

let soundFiles = [];

async function loadAll() {
  const [timeline, materialsRes, soundsRes] = await Promise.all([
    fetch('/api/timeline').then(r => r.json()),
    fetch('/api/materials').then(r => r.json()),
    fetch('/api/sounds').then(r => r.json()),
  ]);
  soundFiles = soundsRes;
  cards = timeline.cards;
  finalExists = !!timeline.final_exists;
  copyMode = !!timeline.copy_mode;
  voiceoverEnd = timeline.voiceover_duration ?? (cards[cards.length - 1]?.end ?? 0);
  // 後方互換: 旧形式 card.clip(単一) を card.clips(リスト) に正規化
  // さらにカードレベルの sfx/sfx_volume をクリップレベルに移行
  cards.forEach(c => {
    if (!c.clips) c.clips = c.clip ? [c.clip] : [];
    delete c.clip;
    if (c.sfx && c.clips.length > 0 && !c.clips.some(cl => cl.sfx)) {
      c.clips[0].sfx = c.sfx;
      c.clips[0].sfx_volume = c.sfx_volume;
    }
    delete c.sfx;
    delete c.sfx_volume;
  });
  // 左パネルのタイトル欄をカード1のデータで初期化
  if (cards.length > 0) {
    document.getElementById('panelTitleInput').value = cards[0].title || '';
    document.getElementById('panelTitleTypewriter').checked = cards[0].title_typewriter !== false;
  }
  materials = materialsRes.clips.sort((a, b) => a.sequence_no - b.sequence_no);
  renderCards();
  updateTotalDuration();

  // カード内のどのコントロールを操作しても、そのカードを「最後に編集したカード」
  // として記録する（イベント委譲。cardPanel自体は再描画で消えないので一度だけ登録）。
  // これで更新完了後、編集したカットにプレビューを合わせられる。
  const panel = document.getElementById('cardPanel');
  const markCard = (e) => {
    const cardEl = e.target.closest('.card');
    if (!cardEl) return;
    const idx = parseInt(cardEl.id.replace('card-', ''), 10);
    if (!Number.isNaN(idx)) _lastEditedCard = idx;
  };
  panel.addEventListener('focusin', markCard);
  panel.addEventListener('input', markCard);
}

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(1);
  return m > 0 ? `${m}分${s}秒` : `${s}秒`;
}

function updateTotalDuration() {
  const total = cards.length ? cards[cards.length - 1].end : 0;
  document.getElementById('totalDuration').innerHTML = `想定再生時間<span class="value">${fmtTime(total)}</span><span class="value" style="margin-left:12px">${cards.length}カード</span>`;
}

function clipFullDuration(filename) {
  const m = materials.find(m => m.file === filename);
  return m ? m.duration : 0;
}

function cardFootHtml(card, i, tagFilter) {
  const hasNext = i < cards.length - 1;
  return `
    <div class="card-foot">
      <button onclick="addCut(${i})">＋ カット追加</button>
      ${hasNext ? `<button onclick="mergeWithNext(${i})">⬇ 次カードと合体</button>` : ''}
      <select id="tagSelect-${i}">
        <option value="either" ${tagFilter === 'either' ? 'selected' : ''}>どちらでも</option>
        <option value="person" ${tagFilter === 'person' ? 'selected' : ''}>人物</option>
        <option value="landscape" ${tagFilter === 'landscape' ? 'selected' : ''}>風景</option>
      </select>
      <button onclick="reassignByTag(${i})">タグで再選定</button>
      <button class="btn-danger" onclick="deleteCard(${i})">🗑 カード削除</button>
    </div>`;
}

function isImageFile(f) {
  return /\.(jpe?g|png|webp)$/i.test(f || '');
}

function clipBlockHtml(card, i, k, footHtml) {
  const clip = card.clips[k];
  const isImg = isImageFile(clip.file);
  const fullDur = clipFullDuration(clip.file);
  const maxIn = Math.max(0, fullDur - (clip.duration || 0));
  const multi = card.clips.length > 1;
  const fileOptions = materials.map(m =>
    `<option value="${m.file}" ${m.file === clip.file ? 'selected' : ''}>${m.file}</option>`
  ).join('');

  return `
    <div class="clip-block">
      ${multi ? `<div class="cut-label">カット${k + 1} / ${card.clips.length}</div>` : ''}
      <div class="clip-row">
        <img class="clip-thumb-md" src="/api/frame?clip=${encodeURIComponent(clip.file)}&n=0"
             title="クリックで左に再生" onclick="playSub(${i},${k})">
        <div class="clip-actions">
          <div class="clip-info" id="clipinfo-${i}-${k}">
            ${clip.file} ${isImg ? '🖼 画像' : `@${(clip.in || 0).toFixed(2)}s`}, ${(clip.duration || 0).toFixed(2)}s
          </div>
          <div class="clip-actions-buttons">
            <button onclick="playCardFinal(${i},${k})">▶ 再生</button>
            ${isImg ? '' : `<button onclick="toggleTrim(${i},${k})">✂️ トリム</button>`}
            <button onclick="swapSub(${i},${k})">🔄 別素材</button>
            <select onchange="selectFileSub(${i},${k},this.value)">${fileOptions}</select>
            ${multi ? `<button class="btn-danger" onclick="deleteCut(${i},${k})">🗑 カット削除</button>` : ''}
          </div>
          ${isImg ? '' : `<div class="trim-row" id="trim-${i}-${k}">
            <span>in: ${(clip.in || 0).toFixed(2)}s</span>
            <input type="range" min="0" max="${maxIn.toFixed(2)}" step="0.05"
                   value="${(clip.in || 0).toFixed(2)}"
                   oninput="onTrimInput(${i},${k},this)"
                   onchange="autosave()">
          </div>`}
          ${clipSfxRowHtml(card, i, k)}
          ${footHtml || ''}
        </div>
      </div>
    </div>`;
}

function renderCards() {
  const panel = document.getElementById('cardPanel');
  panel.innerHTML = '';

  cards.forEach((card, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.id = `card-${i}`;
    const tagFilter = card.tag_filter || 'either';
    const singleClip = card.clips.length === 1;
    const footHtml = cardFootHtml(card, i, tagFilter);

    const blocks = card.clips.map((_, k) =>
      clipBlockHtml(card, i, k, singleClip ? footHtml : '')
    ).join('');

    div.innerHTML = `
      <div class="card-header">
        <span class="card-num"
              onclick="seekFinal(${i})" title="完成版プレビューをこのカードの位置から再生">カード${i + 1}</span>
        <span>${card.start.toFixed(2)}s 〜 ${card.end.toFixed(2)}s</span>
        ${copyMode
          ? `<span class="dur-edit">尺 <input type="number" class="dur-input" min="0.2" step="0.1"
                 value="${(card.end - card.start).toFixed(2)}"
                 onchange="setCardDuration(${i}, this.value)"
                 title="このカードの秒数。変更すると以降のカードも自動でずれます">秒</span>
             ${card.ref_dur ? `<button class="btn-ref" onclick="playReference(${i})"
                 title="参考リールのこのカットを再生（お手本）">▶ お手本</button>` : ''}
             <span class="split-ctrl">
               <button class="btn-split-auto" onclick="autoSplitCard(${i})"
                 title="このカードの中に実際に何カットあるかを自動で判定して分割します（枚数を数えなくてOK）">✂️ 自動分割</button>
               <span class="split-manual" title="自動でうまく分かれないときは、枚数を指定して分割できます">手動
                 <input type="number" class="split-n" min="2" max="8" value="2">
                 <button class="btn-split" onclick="splitCard(${i}, this.previousElementSibling.value)">分割</button>
               </span>
             </span>`
          : `<span>${(card.end - card.start).toFixed(2)}s</span>`}
        <span>${card.text.length}字</span>
        <div class="header-controls">
          ${zoomRowHtml(card, i)}
        </div>
      </div>
      <div class="card-text-area">
        <textarea class="card-text card-text-full" rows="1" oninput="onTextInput(${i}, this)" onchange="autosave()"
          placeholder="${copyMode && card.ref_text ? attrEsc('例）' + card.ref_text) : ''}"
          title="長い場合は自動で2行に折り返されます。Enterで改行位置を指定することもできます">${card.text}</textarea>
        <div class="card-side-controls">
          <div class="ctrl-row">
            ${cardColorPickerHtml(card, i)}
            ${cardFontSizeHtml(card, i)}
          </div>
          <div class="ctrl-row">
            ${cardFontHtml(card, i)}
            ${cardBoxHtml(card, i)}
          </div>
        </div>
      </div>
      <div class="card-controls-below">
        <div class="ctrl-row">
          ${cardEffectHtml(card, i)}
          ${cardTelopYHtml(card, i)}
          ${cardOverlayHtml(card, i)}
        </div>
      </div>
      ${blocks || emptyClipHtml(i)}
      ${singleClip ? '' : footHtml}
    `;
    panel.appendChild(div);
  });
  panel.querySelectorAll('.card-text').forEach(autoResize);
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function onTextInput(i, ta) {
  cards[i].text = ta.value;
  autoResize(ta);
}

function zoomRowHtml(card, i) {
  const on = !!card.zoom;
  const lv = card.zoom_level ?? 20;
  return `<div class="zoom-row">
    <button class="btn-zoom ${on ? 'active' : ''}" onclick="toggleZoom(${i})">🔍 ズーム ${on ? 'ON' : 'OFF'}</button>
    ${on ? `<span class="zoom-vol">倍率
      <input type="range" min="5" max="50" value="${lv}"
        oninput="setZoomLevel(${i},this.value,this.parentNode.querySelector('.zoom-num'),null)"
        onchange="autosave()">
      <input type="number" class="zoom-num" min="5" max="50" value="${lv}"
        oninput="setZoomLevel(${i},this.value,null,this.parentNode.querySelector('input[type=range]'))"
        onchange="autosave()">%
    </span>` : ''}
  </div>`;
}

function toggleZoom(i) {
  cards[i].zoom = !cards[i].zoom;
  if (!cards[i].zoom) delete cards[i].zoom_level;
  markDirty();
  autosave();
  renderCards();
}

function setZoomLevel(i, val, numEl, rangeEl) {
  const v = Math.max(5, Math.min(50, Number(val)));
  cards[i].zoom_level = v;
  if (numEl) numEl.value = v;
  if (rangeEl) rangeEl.value = v;
  markDirty();
}

function sfxRowHtml(card, i) {
  const cats = [...new Set(soundFiles.map(s => s.category))];
  const currentLabel = card.sfx
    ? (soundFiles.find(s => s.path === card.sfx)?.name ?? '効果音なし')
    : '🔇 効果音なし';
  const hassfx = !!card.sfx;
  const vol = card.sfx_volume ?? 30;

  const noneItem = `<div class="sfx-none-row">
    <div class="sfx-item ${!hassfx ? 'active' : ''}" onclick="setSfxAndClose(${i},'')">
      <span class="sfx-item-name">🔇 効果音なし</span>
    </div>
  </div>`;
  const catItems = cats.map(cat => {
    const items = soundFiles.filter(s => s.category === cat).map(s => {
      const esc = s.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<div class="sfx-item ${card.sfx === s.path ? 'active' : ''}" onclick="setSfxAndClose(${i},'${esc}')">
        <button class="sfx-play-btn" onclick="event.stopPropagation();previewSfx('${esc}',80)">▶</button>
        <span class="sfx-item-name">${s.name}</span>
      </div>`;
    }).join('');
    return `<div class="sfx-group-label">${cat}</div><div class="sfx-items-grid">${items}</div>`;
  }).join('');

  return `<div class="sfx-row">
    <div class="sfx-picker" id="sfx-picker-${i}">
      <div class="sfx-trigger" onclick="toggleSfxDropdown(${i})">
        <span class="sfx-trigger-label">${currentLabel}</span><span>▾</span>
      </div>
      <div class="sfx-dropdown" id="sfx-dd-${i}">
        ${noneItem}${catItems}
      </div>
    </div>
    ${hassfx ? `<span class="sfx-vol">🔊<input type="range" min="0" max="150" value="${vol}"
      oninput="setSfxVolume(${i}, this.value, this.parentNode.querySelector('.sfx-num'))"
      onchange="autosave()"><input type="number" class="sfx-num" min="0" max="150" value="${vol}"
      oninput="setSfxVolume(${i}, this.value, null, this.parentNode.querySelector('input[type=range]'))"
      onchange="autosave()">%</span>` : ''}
    ${hassfx ? `<button onclick="setSfx(${i},'')">×</button>` : ''}
  </div>`;
}

function positionSfxDropdown(dd, picker) {
  const rect = picker.getBoundingClientRect();
  const ddWidth = 780;
  let left = rect.left;
  if (left + ddWidth > window.innerWidth - 8) left = window.innerWidth - ddWidth - 8;
  dd.style.top = (rect.bottom + 4) + 'px';
  dd.style.left = Math.max(4, left) + 'px';
}

function toggleSfxDropdown(i) {
  const dd = document.getElementById(`sfx-dd-${i}`);
  const picker = document.getElementById(`sfx-picker-${i}`);
  const isOpen = dd.classList.contains('open');
  document.querySelectorAll('.sfx-dropdown.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) { positionSfxDropdown(dd, picker); dd.classList.add('open'); }
}

function setSfxAndClose(i, path) {
  setSfx(i, path);
  const dd = document.getElementById(`sfx-dd-${i}`);
  if (dd) dd.classList.remove('open');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.sfx-picker')) {
    document.querySelectorAll('.sfx-dropdown.open').forEach(el => el.classList.remove('open'));
  }
});

document.getElementById('cardPanel').addEventListener('scroll', () => {
  document.querySelectorAll('.sfx-dropdown.open').forEach(el => el.classList.remove('open'));
});

function setSfx(i, path) {
  cards[i].sfx = path || undefined;
  if (!path) delete cards[i].sfx_volume;
  markDirty();
  autosave();
  renderCards();
}

function setSfxVolume(i, val, numEl, rangeEl) {
  const v = Math.max(0, Math.min(150, Number(val)));
  cards[i].sfx_volume = v;
  if (numEl) numEl.value = v;
  if (rangeEl) rangeEl.value = v;
}

let sfxAudio = null;
function previewSfx(path, vol) {
  if (sfxAudio) { sfxAudio.pause(); sfxAudio = null; }
  sfxAudio = new Audio('/api/sound?file=' + encodeURIComponent(path));
  sfxAudio.volume = Math.min(1, (vol ?? 30) / 100);
  sfxAudio.play();
}

function onPanelTitleInput(input) {
  if (cards.length > 0) cards[0].title = input.value;
}

function onPanelTitleTypewriterChange(checkbox) {
  if (cards.length > 0) cards[0].title_typewriter = checkbox.checked;
  autosave();
}

// ── 再生 ──────────────────────────────────────
// play()はユーザー操作（クリック）の呼び出しスタック内で同期的に呼ぶ必要がある
// （loadedmetadataイベント等の非同期コールバック内で呼ぶと、ブラウザの自動再生
// 制限に引っかかって再生がブロックされることがある）。そのためplay()は即時に
// 呼び、currentTimeの設定はメタデータ読み込み済みなら即時・未読み込みなら
// loadedmetadataで後から行う。
let _loadingTimer = null;
function scheduleLoading() {
  clearTimeout(_loadingTimer);
  // 500ms以内に再生が始まればオーバーレイは出さない（すぐ表示できる素材でチラつかせない）
  _loadingTimer = setTimeout(() => {
    document.getElementById('loadingOverlay').classList.add('show');
  }, 500);
}
function hideLoading() {
  clearTimeout(_loadingTimer);
  document.getElementById('loadingOverlay').classList.remove('show');
}

function playSegment(file, inPoint, duration) {
  const video = document.getElementById('previewVideo');
  playUntil = null;
  video.loop = false;    // お手本ループ(<video loop>)を必ず解除してから素材を再生する
  hideOverlayPreview();  // 素材再生に切り替わるので前カードのオーバーレイ表示は消す

  const applyRange = () => {
    video.currentTime = inPoint;
    playUntil = inPoint + duration;
  };

  if (currentPlayingFile !== file) {
    currentPlayingFile = file;
    showingFinal = false;
    video.src = `/api/clip?file=${encodeURIComponent(file)}`;
    // 初回は変換に時間がかかることがある。黒画面だけだと不安なので
    // 少し待っても再生が始まらなければ「変換中」オーバーレイを出す。
    scheduleLoading();
  }

  if (video.readyState >= 1) {
    applyRange();
  } else {
    video.addEventListener('loadedmetadata', applyRange, { once: true });
  }
  video.play().catch(() => {});
}

function playSub(i, k) {
  const clip = cards[i].clips[k];
  if (!clip) return;
  if (currentPlayingFile !== clip.file) {
    setStatus('読み込み中...（初回はプレビュー用に変換するため数秒〜数十秒かかります）');
  }
  playSegment(clip.file, clip.in, clip.duration);
}

document.getElementById('previewVideo').addEventListener('playing', () => {
  hideLoading();  // 再生できた＝変換完了。オーバーレイを消す
  // 実際に再生できている＝読み込めているので、「読み込み中」や
  // 「読み込めません」等の警告が残っていれば消す（矛盾表示の防止）
  const t = document.getElementById('status').textContent;
  if (t.startsWith('読み込み中') || t.startsWith('⚠️')) {
    setStatus('');
  }
});

document.getElementById('previewVideo').addEventListener('timeupdate', function () {
  if (playUntil !== null && this.currentTime >= playUntil) {
    this.pause();
    playUntil = null;
  }
});

document.getElementById('previewVideo').addEventListener('error', () => {
  hideLoading();
  const v = document.getElementById('previewVideo');
  if (!v.src || v.src.endsWith('#')) return;
  setStatus(showingFinal
    ? '⚠️ 完成版を読み込めません。「今すぐ更新する」で書き出し直してください'
    : '⚠️ 素材を再生できません。「🔄 動画素材フォルダを更新」を押してから再度お試しください');
});
document.getElementById('videoWrap').addEventListener('click', () => {
  const video = document.getElementById('previewVideo');
  if (video.paused) {
    playUntil = null;
    if (!video.src) {
      // 動画未ロード → 完成版を読み込んで再生
      currentPlayingFile = null;
      showingFinal = true;
      video.src = `/api/final?t=${Date.now()}`;
    }
    video.play().catch(() => {});
  } else {
    video.pause();
  }
});

document.getElementById('previewVideo').addEventListener('play',  () => {
  document.getElementById('playIcon').classList.add('hidden');
});
document.getElementById('previewVideo').addEventListener('pause', () => {
  document.getElementById('playIcon').classList.remove('hidden');
});

// ── トリム ────────────────────────────────────
function toggleTrim(i, k) {
  const row = document.getElementById(`trim-${i}-${k}`);
  const wasOpen = row.classList.contains('open');
  row.classList.toggle('open');
  // 開くとき: クリップを事前読み込みしてスライダー操作を即レスポンスに
  if (!wasOpen) {
    const clip = cards[i].clips[k];
    const video = document.getElementById('previewVideo');
    playUntil = null;
    if (currentPlayingFile !== clip.file) {
      currentPlayingFile = clip.file;
      video.src = `/api/clip?file=${encodeURIComponent(clip.file)}`;
      video.addEventListener('canplay', () => { video.currentTime = clip.in; }, { once: true });
    } else {
      video.currentTime = clip.in;
    }
  }
}

let _trimSaveTimer = null;
function onTrimInput(i, k, range) {
  const clip = cards[i].clips[k];
  clip.in = parseFloat(range.value);
  range.parentElement.querySelector('span').textContent = `in: ${clip.in.toFixed(2)}s`;
  const info = document.getElementById(`clipinfo-${i}-${k}`);
  if (info) info.textContent = `${clip.file} @${clip.in.toFixed(2)}s, ${clip.duration.toFixed(2)}s`;
  // 左プレビューでその位置のフレームを確認（再生はしない）
  const video = document.getElementById('previewVideo');
  playUntil = null;
  if (currentPlayingFile !== clip.file) {
    // フォールバック: 違うファイルの場合は読み込んでからシーク
    currentPlayingFile = clip.file;
    video.src = `/api/clip?file=${encodeURIComponent(clip.file)}`;
    video.addEventListener('canplay', () => { video.currentTime = clip.in; }, { once: true });
  } else {
    video.currentTime = clip.in;
  }
  // 入力が止まって500ms後に自動保存
  clearTimeout(_trimSaveTimer);
  _trimSaveTimer = setTimeout(() => saveTimeline(true), 500);
}

// ── in点の自動選定（assign_clips.pyのpick_in_pointと同じ考え方）──
function pickInPoint(material, cardDuration) {
  const maxIn = Math.max(0, material.duration - cardDuration);
  if (material.good_in != null) {
    return Math.min(Math.max(0, material.good_in), maxIn);
  }
  for (const t of (material.motion_ts || [])) {
    if (t <= maxIn) return t;
  }
  return Math.min(material.duration * 0.3, maxIn);
}

// このカードの他サブクリップ・隣接カードと違う素材を選ぶ（毎カット切替のため）
function neighborFiles(i) {
  const files = [];
  if (cards[i - 1]) cards[i - 1].clips.forEach(c => files.push(c.file));
  if (cards[i + 1]) cards[i + 1].clips.forEach(c => files.push(c.file));
  return files;
}

function pickDistinctMaterial(i, excludeFiles) {
  const exclude = new Set([...excludeFiles, ...neighborFiles(i)]);
  return materials.find(m => !exclude.has(m.file)) || materials[0];
}

function applyClipToSub(card, k, material, subDuration) {
  card.clips[k] = {
    file: material.file,
    in: pickInPoint(material, subDuration),
    duration: round3(subDuration),
  };
}

function round3(x) { return Math.round(x * 1000) / 1000; }
// HTML属性に文字列を安全に入れる（テロップ見本のplaceholder用）
function attrEsc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/[\r\n]+/g, ' ');
}

// ── 素材の差し替え（サブクリップ単位）──────────────
function swapSub(i, k) {
  const card = cards[i];
  const cur = card.clips[k].file;
  const currentIdx = materials.findIndex(m => m.file === cur);
  // このカードの他サブクリップ・隣接カードと被らない次の素材へ巡回
  const exclude = new Set([
    ...card.clips.filter((_, kk) => kk !== k).map(c => c.file),
    ...neighborFiles(i),
  ]);

  let nextIdx = (currentIdx + 1) % materials.length;
  for (let s = 1; s < materials.length; s++) {
    const idx = (currentIdx + s) % materials.length;
    if (!exclude.has(materials[idx].file)) { nextIdx = idx; break; }
  }
  applyClipToSub(card, k, materials[nextIdx], card.clips[k].duration);
  renderCards();
  playSub(i, k);
  autosave();
}

function selectFileSub(i, k, filename) {
  const card = cards[i];
  const material = materials.find(m => m.file === filename);
  if (material) {
    applyClipToSub(card, k, material, card.clips[k].duration);
    renderCards();
    playSub(i, k);
    autosave();
  }
}

// 未割当てカード用：素材選択プルダウン
function emptyClipHtml(i) {
  const opts = ['<option value="">📁 素材を選んで割り当て…</option>']
    .concat(materials.map(m => `<option value="${m.file}">${m.file}</option>`))
    .join('');
  return `
    <div class="clip-block">
      <div class="clip-info">（未割当て）↓ 下のプルダウンから映像素材を選んでください</div>
      <div class="clip-actions-buttons">
        <select onchange="assignFirstClip(${i}, this.value)">${opts}</select>
      </div>
    </div>`;
}

// ── リール間コピー: カード秒数を数字で変更する ──────────
// 指定カードの尺をdに変え、以降のカードは自分の尺を保ったまま連続するようずらす。
// カード内のクリップ（割当て済み素材）も新しい尺に合わせて伸縮する。
function setCardDuration(i, val) {
  const d = round3(Math.max(0.2, Number(val) || 0));
  const card = cards[i];
  const clips = card.clips || [];
  if (clips.length === 1) {
    clips[0].duration = d;
  } else if (clips.length > 1) {
    const cur = clips.reduce((s, c) => s + (c.duration || 0), 0) || d;
    const factor = d / cur;
    clips.forEach(c => { c.duration = round3((c.duration || 0) * factor); });
    // 丸め誤差は最後のカットで吸収して合計をdに合わせる
    const drift = round3(d - clips.reduce((s, c) => s + c.duration, 0));
    clips[clips.length - 1].duration = round3(clips[clips.length - 1].duration + drift);
  }
  // 各カードの尺を保持したまま、iだけdに差し替えて全カードを連続配置し直す
  const durs = cards.map(c => round3(c.end - c.start));
  durs[i] = d;
  let t = 0;
  cards.forEach((c, idx) => { c.start = round3(t); c.end = round3(t + durs[idx]); t = c.end; });
  renderCards();
  updateTotalDuration();
  autosave();
}

// ── リール間コピー: 1枚のカードをn枚に分割する ──────────
// 同構図のジャンプカット（画がほぼ変わらない切り替え）はシーン検出で拾えず、
// 実際は複数カットなのに1カードになることがある。お手本を見て気づいたら、
// このカードをn等分に割る。合計の尺は変えない（以降のカードはずれない）。
// お手本の参照区間(ref_in/ref_dur)も等分して、各カードが自分の担当カットを再生できる。
// 自動分割（おすすめ）: このカードの参考区間の中に実際に何カットあるかを
// サーバーが検出し、その数だけ・元リールの不均等な尺で割る。ユーザーは枚数を
// 当てる必要がない（「何分割か分からない」問題への回答）。
async function autoSplitCard(i) {
  const card = cards[i];
  const refIn0 = card.ref_in || 0;
  const refDur = card.ref_dur != null ? card.ref_dur : round3(card.end - card.start);
  setStatus('参考リールのカット数を自動で調べています…');
  let segs = null;
  try {
    const res = await fetch(`/api/detect_splits?start=${refIn0}&dur=${refDur}&n=auto`)
      .then(r => r.json());
    if (res.ok && Array.isArray(res.segments)) segs = res.segments;
  } catch (e) { /* 下でフォールバック案内 */ }
  if (!segs || segs.length < 2) {
    setStatus(`カード${i + 1}の中に追加のカットは見つかりませんでした（このカードは1カットのようです。分けたいときは枚数を指定して「分割」してください）`);
    return;
  }
  applySplit(i, segs, `カード${i + 1}を自動で${segs.length}カットに分割しました`);
}

// 手動分割: 枚数nを指定。参考区間をその数のカット境界で不均等に割る（失敗時は均等割り）。
async function splitCard(i, n) {
  n = Math.max(2, Math.min(8, Math.round(Number(n) || 2)));
  const card = cards[i];
  const refIn0 = card.ref_in || 0;
  const refDur = card.ref_dur != null ? card.ref_dur : round3(card.end - card.start);
  let refSegs = null;
  setStatus('参考リールのカット位置を解析中…');
  try {
    const res = await fetch(`/api/detect_splits?start=${refIn0}&dur=${refDur}&n=${n}`)
      .then(r => r.json());
    if (res.ok && Array.isArray(res.segments) && res.segments.length === n) refSegs = res.segments;
  } catch (e) { /* フォールバックへ */ }
  if (!refSegs) {
    const rp = round3(refDur / n);
    refSegs = Array.from({ length: n }, (_, k) => ({
      ref_in: round3(refIn0 + rp * k),
      ref_dur: k === n - 1 ? round3(refDur - rp * (n - 1)) : rp,
    }));
  }
  applySplit(i, refSegs, `カード${i + 1}を${n}枚に分割しました`);
}

// 分割の適用（共通）: refSegs（{ref_in,ref_dur}の配列）に従ってカードiを置き換える。
// タイムライン尺は参考区間の比率でカードの尺に配分（合計=元のカード尺で不変・後続はずれない）。
// テロップ見本・スタイルは引き継ぎ、各カードは自分の担当カットをお手本再生できる。
function applySplit(i, refSegs, statusMsg) {
  const card = cards[i];
  const span = round3(card.end - card.start);
  const n = refSegs.length;
  const refTotal = refSegs.reduce((s, x) => s + x.ref_dur, 0) || span;
  const pieces = refSegs.map(sg => round3(span * (sg.ref_dur / refTotal)));
  pieces[n - 1] = round3(span - pieces.slice(0, n - 1).reduce((s, x) => s + x, 0));  // 合計=span

  const STYLE_KEYS = ['title', 'title_typewriter', 'telop_color', 'telop_fontsize',
                      'telop_font', 'telop_box', 'telop_y'];
  const newCards = refSegs.map((sg, k) => {
    const c = {
      id: 0, text: k === 0 ? card.text : '', char_count: k === 0 ? (card.text || '').length : 0,
      start: 0, end: 0, clips: [], tag_filter: card.tag_filter || 'either',
      ref_in: sg.ref_in, ref_dur: sg.ref_dur,
      // 1つのテロップが複数カットにまたがるので、分割した全カードに同じ見本を引き継ぐ
      ref_text: card.ref_text || '',
    };
    if (k === 0) STYLE_KEYS.forEach(key => { if (card[key] !== undefined) c[key] = card[key]; });
    return c;
  });

  const durs = cards.map(c => round3(c.end - c.start));
  durs.splice(i, 1, ...pieces);
  cards.splice(i, 1, ...newCards);
  cards.forEach((c, idx) => { c.id = idx + 1; });
  let t = 0;
  cards.forEach((c, idx) => { c.start = round3(t); c.end = round3(t + durs[idx]); t = c.end; });
  renderCards();
  updateTotalDuration();
  const detail = pieces.map(p => p.toFixed(2)).join(' / ');
  setStatus(`${statusMsg}（${detail}秒・参考リールのカット位置どおり／合計の尺は変わりません）`);
  autosave();
}

// ── リール間コピー: 参考リールの該当カットを再生（お手本）──
// お手本プレビュー: このカードのカットだけを再生する。
// サーバーが参考リールから該当区間だけを切り出した動画を配信し、<video loop>で
// ネイティブにループする。JSタイマーで止める方式（rAF/timeupdate）はタブが非表示だと
// 効かず次シーンにはみ出すため使わない。この方式なら構造上、絶対に次カットは映らない。
function playReference(i) {
  const card = cards[i];
  if (card.ref_dur == null) return;
  const video = document.getElementById('previewVideo');
  playUntil = null;
  hideOverlayPreview();
  showingFinal = false;
  currentPlayingFile = '__reference__' + i;  // 素材再生に切り替わったら必ず読み直す
  video.loop = true;
  video.src = `/api/refclip?in=${(card.ref_in || 0).toFixed(3)}&dur=${card.ref_dur.toFixed(3)}`;
  setStatus(`お手本: このカードのカットだけを繰り返し再生中（${card.ref_dur.toFixed(2)}秒）`);
  scheduleLoading();
  video.play().catch(() => {});
}

// 未割当てカードに最初の素材を割り当てる
function assignFirstClip(i, filename) {
  if (!filename) return;
  const card = cards[i];
  const material = materials.find(m => m.file === filename);
  if (!material) return;
  const dur = round3(card.end - card.start);
  card.clips = [{ file: material.file, in: pickInPoint(material, dur), duration: dur }];
  renderCards();
  playSub(i, 0);
  autosave();
}

// ── カット追加 / 削除（1カードに複数素材）──────────
function addCut(i) {
  const card = cards[i];
  const cardDur = card.end - card.start;
  const n = card.clips.length + 1;
  const sub = round3(cardDur / n);
  // 既存サブクリップの尺を均等割りに再設定
  card.clips.forEach(c => { c.duration = sub; });
  // 追加する2つ目以降は、既存・隣接と違う素材を自動選定
  const usedHere = card.clips.map(c => c.file);
  const mat = pickDistinctMaterial(i, usedHere);
  card.clips.push({ file: mat.file, in: pickInPoint(mat, sub), duration: sub });
  renderCards();
  setStatus(`カットを追加しました（${n}カット）`);
  autosave();
}

function deleteCut(i, k) {
  const card = cards[i];
  if (card.clips.length <= 1) return;
  card.clips.splice(k, 1);
  const cardDur = card.end - card.start;
  const sub = round3(cardDur / card.clips.length);
  card.clips.forEach(c => { c.duration = sub; });
  renderCards();
  autosave();
}

// ── カード合体（カードiと次カードi+1を1枚にまとめる）────
function mergeWithNext(i) {
  if (i >= cards.length - 1) return;
  const a = cards[i];
  const b = cards[i + 1];
  // テロップは連結（次カードのテキストを後ろにつなぐ）
  a.text = (a.text || '') + (b.text || '');
  // 尺は次カードの終わりまで伸ばす
  a.end = b.end;
  // 映像は両カードのサブクリップを連結（前半=a、後半=bの映像）
  a.clips = a.clips.concat(b.clips);
  // 合体後のカード尺を全サブクリップで均等割り（「＋カット追加」と同じ挙動）
  const dur = round3(a.end - a.start);
  const sub = round3(dur / a.clips.length);
  a.clips.forEach(c => {
    c.duration = sub;
    // 折半で伸びた尺が素材長を超える場合はin点を後ろにずらしすぎないようクランプ
    const full = clipFullDuration(c.file);
    if (full && c.in + sub > full) c.in = Math.max(0, round3(full - sub));
  });
  // 次カードを配列から除去
  cards.splice(i + 1, 1);
  recalcCardTimes();
  renderCards();
  updateTotalDuration();
  autosave();
  setStatus(`カードを合体しました（${a.clips.length}カット）`);
}

// ── タグによる再選定（カードを単一クリップに戻す）──────
async function reassignByTag(i) {
  const card = cards[i];
  const tagFilter = document.getElementById(`tagSelect-${i}`).value;

  const res = await fetch('/api/reassign', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ card_id: card.id, tag_filter: tagFilter }),
  });
  const data = await res.json();
  if (data.ok) {
    card.clips = data.clips;
    card.tag_filter = tagFilter;
    renderCards();
    setStatus('タグで素材を再選定しました');
    autosave();
  } else {
    setStatus(`❌ ${data.error}`);
  }
}

// ── カード削除（直前の1件だけ取り消し可能）──────────
let lastDeleted = null; // {card, index}
let _undoHideTimer = null;

function recalcCardTimes() {
  let t = 0;
  cards.forEach(card => {
    const dur = card.end - card.start;
    card.start = round3(t);
    card.end = round3(t + dur);
    t += dur;
  });
}

function showUndoToast() {
  clearTimeout(_undoHideTimer);
  document.getElementById('undoToast').classList.remove('hidden');
  _undoHideTimer = setTimeout(() => {
    document.getElementById('undoToast').classList.add('hidden');
    lastDeleted = null;
  }, 30000);
}

function undoDeleteCard() {
  if (!lastDeleted) return;
  clearTimeout(_undoHideTimer);
  cards.splice(lastDeleted.index, 0, lastDeleted.card);
  lastDeleted = null;
  document.getElementById('undoToast').classList.add('hidden');
  recalcCardTimes();
  renderCards();
  updateTotalDuration();
  autosave();
}

function deleteCard(i) {
  lastDeleted = { card: JSON.parse(JSON.stringify(cards[i])), index: i };
  const wasLast = (i === cards.length - 1);
  const delDur = round3(cards[i].end - cards[i].start);
  cards.splice(i, 1);

  // リール間コピー: 合計尺＝参考リールとの同期が命。単に削除すると recalcCardTimes が
  // 削除カードの尺だけ全体を縮め、以降のカードが前へずれて「後半がごっそり消える」。
  // そこで削除カードの尺を隣（原則ひとつ前、無ければ次）のカードに吸収させ、
  // 合計尺を保つ＝分割のやり直しで後続がずれないようにする（バグ修正）。
  if (copyMode && cards.length > 0 && delDur > 0) {
    const nb = i > 0 ? i - 1 : 0;   // ひとつ前のカード（先頭を消したら新しい先頭）
    const neighbor = cards[nb];
    neighbor.end = round3(neighbor.end + delDur);        // recalcCardTimes が dur=end-start で拾う
    if (neighbor.ref_dur != null) neighbor.ref_dur = round3(neighbor.ref_dur + delDur);
    if (neighbor.clips && neighbor.clips.length) {       // 割当て済みならクリップ尺も伸ばす
      const per = round3(delDur / neighbor.clips.length);
      neighbor.clips.forEach(cl => { cl.duration = round3((cl.duration || 0) + per); });
    }
  }

  // 末尾カードを削除した場合、新しい末尾カードをボイスオーバー終端まで延長
  // （アフレコ編集フロー用。copyModeは上で尺を保持済みなのでここは通常スキップ）
  if (!copyMode && wasLast && cards.length > 0 && voiceoverEnd > 0) {
    const last = cards[cards.length - 1];
    const ext = voiceoverEnd - last.end;
    if (ext > 0.01) {
      last.end = Math.round(voiceoverEnd * 1000) / 1000;
      last.clips.forEach(cl => { cl.duration = Math.round((cl.duration + ext) * 1000) / 1000; });
    }
  }
  recalcCardTimes();
  renderCards();
  updateTotalDuration();
  autosave();
  showUndoToast();
}

// ── レンダー状態表示 ──────────────────────────────
function setRenderStatus(msg, color) {
  const el = document.getElementById('render-status');
  el.textContent = msg;
  el.style.color = color || 'var(--text-muted)';
  el.style.display = msg ? 'block' : 'none';
}

// ── 自動書き出し ──────────────────────────────────
let _saveTimer = null;
let _renderTimer = null;
let _rendering = false;
let _pendingRender = false;
// 最後に操作したカードのindex。更新完了後、プレビューをこのカードの位置へ
// 合わせるために使う（編集したカットが確認画面に出るようにする）
let _lastEditedCard = null;

function scheduleAutoRender(delay) {
  clearTimeout(_renderTimer);
  setRenderStatus('🕐 自動更新予定...', '#f5a623');
  _renderTimer = setTimeout(_autoRender, delay ?? 2500);
}

async function _autoRender() {
  if (_rendering) { _pendingRender = true; return; }
  _rendering = true;

  const video = document.getElementById('previewVideo');
  const savedTime = video.currentTime;
  const wasFinal = showingFinal;

  clearTimeout(_saveTimer);
  setRenderStatus('⏳ 更新中です...', 'var(--text-muted)');
  document.getElementById('renderBtn').disabled = true;

  try {
    await fetch('/api/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cards }),
    });
    const res = await fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({}),
    });
    const data = await res.json();

    if (data.ok) {
      finalExists = true;
      // 更新に成功。リール間コピーでは、まだ素材が入っていないカードは参考リールで
      // 仮表示している旨を青字で案内する（未割当てでも詰まらせない）。通常フローでは空に。
      copyPlaceholderNotice();
      setRenderStatus('✅ 更新完了', '#f5a623');
      setTimeout(() => setRenderStatus(''), 5000);
      // 更新完了後は完成版をプレビューに読み込む。
      // 編集したカットが分かっていれば、その位置に合わせて確認できるようにする
      // （直前に停止していた無関係な位置を復元してしまう問題への対策）。
      // 編集カットが不明な場合のみ、完成版を見ていた位置を復元する。
      currentPlayingFile = null;
      showingFinal = true;
      video.src = `/api/final?t=${Date.now()}`;
      const edited = _lastEditedCard;
      if (edited != null && cards[edited]) {
        playUntil = cards[edited].end;
        video.addEventListener('loadedmetadata', () => {
          video.currentTime = cards[edited].start;
          video.play().catch(() => {});
        }, { once: true });
      } else if (wasFinal) {
        video.addEventListener('loadedmetadata', () => {
          video.currentTime = savedTime;
        }, { once: true });
      }
    } else {
      setRenderStatus(`❌ ${data.error}`, '#f44336');
    }
  } catch (err) {
    setRenderStatus('❌ 通信エラー（サーバーを再起動してください）', '#f44336');
  } finally {
    _rendering = false;
    document.getElementById('renderBtn').disabled = false;
  }

  if (_pendingRender) {
    _pendingRender = false;
    scheduleAutoRender(500);
  }
}

// ── 自動保存（編集のたびにtimeline.jsonへ）──
function autosave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    await fetch('/api/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cards }),
    });
  }, 300);
  scheduleAutoRender(2500);
}

function markDirty() {} // 後方互換（autosaveがscheduleAutoRenderを兼ねるため不要）
function clearDirty() {}

// ── 保存・書き出し ──────────────────────────────
function setStatus(msg) {
  const el = document.getElementById('status');
  el.style.color = '';   // 既定色に戻す（copyPlaceholderNoticeが着けた色を残さない）
  el.textContent = msg;
}

// リール間コピー: 完成版を作ったあと、まだ素材が入っていない（参考リールの映像で
// 仮表示中の）カードを、詰まらせない案内として青字で伝える。全部埋まったら緑字。
function copyPlaceholderNotice() {
  const el = document.getElementById('status');
  if (!copyMode) { setStatus(''); return; }
  const nums = cards.map((c, i) => (!c.clips || c.clips.length === 0) ? (i + 1) : null)
                    .filter(x => x !== null);
  if (!nums.length) {
    el.style.color = '#2E7D32';
    el.textContent = '✅ 全カードに素材が入りました。完成版を確認できます';
  } else {
    el.style.color = '#3A6FB0';
    el.textContent = `▶ プレビューできます（カード ${nums.join('、')} はまだ参考リールの映像で仮表示中）。この順番で自分の素材を割り当てていってください`;
  }
}

// ── テロップ色の選択 ──────────────────────────────
const TELOP_COLORS = [
  { name: '白',     hex: null,     css: '#ffffff' },
  { name: '赤',     hex: 'FF3B30', css: '#ff3b30' },
  { name: '青',     hex: '1E90FF', css: '#1e90ff' },
  { name: '黄',     hex: 'FFDD00', css: '#ffdd00' },
  { name: 'ピンク', hex: 'FF4FA3', css: '#ff4fa3' },
];

// カード個別の色ピッカー（各カード内）
function cardColorPickerHtml(card, i) {
  const swatches = TELOP_COLORS.map(c => {
    const active = (card.telop_color || null) === (c.hex || null);
    return `<button title="${c.name}" onclick="setCardTelopColor(${i},${c.hex ? `'${c.hex}'` : 'null'})"
      style="width:18px;height:18px;padding:0;border-radius:50%;background:${c.css};
      border:2px solid ${active ? 'var(--accent)' : 'var(--border-strong)'};cursor:pointer"></button>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--text-muted)">テロップ色</span>${swatches}</div>`;
}

function setCardTelopColor(i, hex) {
  cards[i].telop_color = hex;
  renderCards();
  autosave();
}

// カード個別のテロップフォントサイズ（null=標準45）
const TELOP_SIZES = [
  { name: '標準', size: null },
  { name: '大',   size: 58 },
  { name: '特大', size: 72 },
  { name: '最大', size: 88 },
];

function cardFontSizeHtml(card, i) {
  const cur = card.telop_fontsize || null;
  const btns = TELOP_SIZES.map(s => {
    const active = (cur || null) === (s.size || null);
    return `<button onclick="setCardFontSize(${i},${s.size ?? 'null'})"
      style="padding:2px 8px;font-size:11px;border-radius:4px;cursor:pointer;
      border:1px solid ${active ? 'var(--accent)' : 'var(--border-strong)'};
      background:${active ? 'var(--accent-soft)' : 'var(--surface-3)'};color:var(--text)">${s.name}</button>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--text-muted)">サイズ</span>${btns}</div>`;
}

function setCardFontSize(i, size) {
  cards[i].telop_fontsize = size;
  renderCards();
  autosave();
}

// カード個別のテロップフォント（既定=角ゴ太字。captions.pyのFONTSと対応）
const TELOP_FONTS = ['角ゴ標準', '角ゴ太字', '丸ゴ', '明朝'];

function cardFontHtml(card, i) {
  const cur = card.telop_font || '角ゴ太字';
  const btns = TELOP_FONTS.map(f => {
    const active = cur === f;
    return `<button onclick="setCardFont(${i},'${f}')"
      style="padding:2px 8px;font-size:11px;border-radius:4px;cursor:pointer;
      border:1px solid ${active ? 'var(--accent)' : 'var(--border-strong)'};
      background:${active ? 'var(--accent-soft)' : 'var(--surface-3)'};color:var(--text)">${f}</button>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--text-muted)">フォント</span>${btns}</div>`;
}

function setCardFont(i, font) {
  cards[i].telop_font = font;
  renderCards();
  autosave();
}

// カット頭の強調演出（render.pyのeffectと対応）
const TELOP_EFFECTS = [
  { name: 'なし',         val: null },
  { name: 'ズームパンチ', val: 'zoom_punch' },
  { name: 'シェイク',     val: 'shake' },
  { name: 'フラッシュ',   val: 'flash' },
];

function cardEffectHtml(card, i) {
  const cur = card.effect || null;
  const btns = TELOP_EFFECTS.map(e => {
    const active = (cur || null) === (e.val || null);
    return `<button onclick="setCardEffect(${i},${e.val ? `'${e.val}'` : 'null'})"
      style="padding:2px 8px;font-size:11px;border-radius:4px;cursor:pointer;
      border:1px solid ${active ? 'var(--accent)' : 'var(--border-strong)'};
      background:${active ? 'var(--accent-soft)' : 'var(--surface-3)'};color:var(--text)">${e.name}</button>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--text-muted)">頭の演出</span>${btns}</div>`;
}

function setCardEffect(i, val) {
  cards[i].effect = val;
  renderCards();
  autosave();
}

// テロップの装飾（標準=グロー／背景ボックス=半透明の箱）
function cardBoxHtml(card, i) {
  const on = !!card.telop_box;
  const opts = [{ name: '標準', v: false }, { name: '背景ボックス', v: true }];
  const btns = opts.map(o => {
    const active = on === o.v;
    return `<button onclick="setCardBox(${i},${o.v})"
      style="padding:2px 8px;font-size:11px;border-radius:4px;cursor:pointer;
      border:1px solid ${active ? 'var(--accent)' : 'var(--border-strong)'};
      background:${active ? 'var(--accent-soft)' : 'var(--surface-3)'};color:var(--text)">${o.name}</button>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--text-muted)">装飾</span>${btns}</div>`;
}

function setCardBox(i, v) {
  cards[i].telop_box = v;
  renderCards();
  autosave();
}

// ── テロップの縦位置（中央からのpx。captions.pyのy_offsetと対応）──────────
// 未調整のカードは captions.py と同じ既定値（フォントサイズ×2.5行分）を表示する。
function telopYOf(card) {
  if (card.telop_y !== undefined && card.telop_y !== null) return card.telop_y;
  return Math.round(2.5 * (card.telop_fontsize || 45));
}

function cardTelopYHtml(card, i) {
  const cur = telopYOf(card);
  return `<div style="display:flex;align-items:center;gap:6px">
    <span style="font-size:11px;color:var(--text-muted)">縦位置</span>
    <input type="range" min="-700" max="700" step="10" value="${cur}" style="width:90px"
      oninput="setCardTelopY(${i}, this.value)" title="上下にドラッグしてテロップの高さを調整（0で画面中央）">
    <span id="telopY${i}" style="font-size:11px;color:var(--text-muted);min-width:38px">${cur}</span>
    <button onclick="applyTelopYToAll(${i})" title="この縦位置を全カードに適用"
      style="padding:2px 8px;font-size:11px;border-radius:4px;cursor:pointer;
      border:1px solid var(--border-strong);background:var(--surface-3);color:var(--text)">全カードへ</button>
  </div>`;
}

function setCardTelopY(i, val) {
  cards[i].telop_y = Number(val);
  const label = document.getElementById(`telopY${i}`);   // ドラッグ中は再描画せず数値だけ更新
  if (label) label.textContent = val;
  scheduleTelopYSave();
}

let _telopYSaveTimer = null;
function scheduleTelopYSave() {
  clearTimeout(_telopYSaveTimer);
  _telopYSaveTimer = setTimeout(() => autosave(), 400);
}

function applyTelopYToAll(i) {
  const v = telopYOf(cards[i]);
  cards.forEach(c => { c.telop_y = v; });
  renderCards();
  autosave();
}

// ── カードに画像を重ねる（オーバーレイ）──────────────
function cardOverlayHtml(card, i) {
  const imgs = materials.filter(m => m.is_image);
  const ov = card.overlay;
  const opts = ['<option value="">重ねる画像なし</option>'].concat(
    imgs.map(m => `<option value="${m.file}" ${ov && ov.file === m.file ? 'selected' : ''}>${m.file}</option>`)
  ).join('');
  let sliders = '';
  if (ov && ov.file) {
    const pct = v => Math.round(v * 100);
    sliders = `
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px">
        <span style="font-size:11px;color:var(--text-muted)">サイズ</span>
        <input type="range" min="10" max="100" value="${pct(ov.scale)}" style="width:80px"
          oninput="setOverlayParam(${i},'scale',this.value/100)">
        <span style="font-size:11px;color:var(--text-muted)">横</span>
        <input type="range" min="0" max="100" value="${pct(ov.x)}" style="width:70px"
          oninput="setOverlayParam(${i},'x',this.value/100)">
        <span style="font-size:11px;color:var(--text-muted)">縦</span>
        <input type="range" min="0" max="100" value="${pct(ov.y)}" style="width:70px"
          oninput="setOverlayParam(${i},'y',this.value/100)">
        <button onclick="previewOverlay(${i})" style="font-size:11px;padding:3px 10px">▶ 位置を確認</button>
      </div>`;
  }
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
    <span style="font-size:11px;color:var(--text-muted)">画像を重ねる</span>
    <select onchange="setCardOverlay(${i},this.value)">${opts}</select>${sliders}</div>`;
}

function setCardOverlay(i, file) {
  if (!file) {
    delete cards[i].overlay;
    hideOverlayPreview();
  } else {
    const cur = cards[i].overlay || {};
    cards[i].overlay = { file, scale: cur.scale ?? 0.8, x: cur.x ?? 0.5, y: cur.y ?? 0.5 };
  }
  renderCards();
  if (cards[i].overlay) previewOverlay(i);
  autosave();
}

function setOverlayParam(i, key, val) {
  if (!cards[i].overlay) return;
  cards[i].overlay[key] = Number(val);
  updateOverlayPreview(cards[i]);   // ドラッグ中はライブでプレビューだけ更新
  scheduleOverlaySave();
}

let _ovlSaveTimer = null;
function scheduleOverlaySave() {
  clearTimeout(_ovlSaveTimer);
  _ovlSaveTimer = setTimeout(() => autosave(), 400);
}

// カードの映像を左プレビューで再生しつつ、その上に画像を重ねて位置確認する
function previewOverlay(i) {
  const card = cards[i];
  if (!card.overlay) return;
  const clip = card.clips[0];
  if (clip) playSegment(clip.file, clip.in, clip.duration);
  updateOverlayPreview(card);
}

function updateOverlayPreview(card) {
  const img = document.getElementById('overlayPreview');
  if (!card.overlay || !card.overlay.file) { img.style.display = 'none'; return; }
  const ov = card.overlay;
  img.src = `/api/frame?clip=${encodeURIComponent(ov.file)}&n=0`;
  img.style.left = (ov.x * 100) + '%';
  img.style.top = (ov.y * 100) + '%';
  img.style.width = (ov.scale * 100) + '%';
  img.style.display = 'block';
}

function hideOverlayPreview() {
  document.getElementById('overlayPreview').style.display = 'none';
}

// ── 素材フォルダの手動再読み込み ──────────────────────
async function rescanMaterials() {
  const btn = document.getElementById('rescanBtn');
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = '⏳ 読み込み中...';
  setStatus('素材フォルダを読み込み中...');
  try {
    const res = await fetch('/api/rescan', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    const data = await res.json();
    materials = (data.clips || materials).sort((a, b) => a.sequence_no - b.sequence_no);
    // フォルダから消えた素材でカード割り当てが外れた場合があるのでタイムラインも取り直す
    const tl = await fetch('/api/timeline').then(r => r.json());
    cards = tl.cards;
    renderCards();
    updateTotalDuration();
    const added = data._added || 0, removed = data._removed || 0;
    const parts = [];
    if (added) parts.push(`新規${added}本を追加`);
    if (removed) parts.push(`消えた素材${removed}本を除去`);
    setStatus(parts.length
      ? `✅ ${parts.join(' / ')}（計${materials.length}本）`
      : `変更なし（計${materials.length}本）`);
  } catch (e) {
    setStatus('❌ 素材の読み込みに失敗しました');
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

async function saveTimeline() {
  setStatus('保存中...');
  await fetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cards }),
  });
  setStatus('');
}

async function renderFinal() {
  clearTimeout(_saveTimer);
  clearTimeout(_renderTimer);
  if (_rendering) return;
  await _autoRender();
}

function showFinal() {
  hideOverlayPreview();
  if (!finalExists) {
    setStatus('まだ書き出していません。「今すぐ更新する」を押すと完成版が作成されます');
    return;
  }
  const video = document.getElementById('previewVideo');
  video.loop = false;    // お手本ループを解除
  currentPlayingFile = null;
  showingFinal = true;
  playUntil = null;
  video.src = `/api/final?t=${Date.now()}`;
  video.addEventListener('loadedmetadata', () => {
    video.currentTime = 0;
    video.play().catch(() => {});
  }, { once: true });
}

async function exportReel() {
  if (!finalExists) {
    setStatus('まだ書き出していません。「今すぐ更新する」で完成版を作成してから出力してください');
    return;
  }
  // 出力時だけHDR素材の色補正をかけて書き出す（編集中の更新は変換なしで速いまま）。
  // 混在素材でも各シーンが正しい色になる。初回は変換のぶん少し時間がかかる。
  setRenderStatus('🎨 色を補正して書き出し中…（初回は少し時間がかかります）', 'var(--text-muted)');
  try {
    const res = await fetch('/api/export_render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}),
    });
    const d = await res.json();
    if (!d.ok) { setRenderStatus(`❌ ${d.error}`, '#f44336'); return; }
    setRenderStatus('✅ 書き出し完了', '#f5a623');
    setTimeout(() => setRenderStatus(''), 5000);
    const a = document.createElement('a');
    a.href = `/api/export?t=${Date.now()}`;
    a.download = 'reel.mp4';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch (err) {
    setRenderStatus('❌ 書き出しに失敗しました（サーバーを確認してください）', '#f44336');
  }
}

// カード番号をクリックすると、完成版プレビューをそのカードの位置から再生する。
// 30枚目のカードを直しても、確認のために毎回頭から再生する必要がなくなる。
function seekFinal(i) {
  hideOverlayPreview();
  if (!finalExists) {
    if (cards[i].clips && cards[i].clips.length) { playSub(i, 0); }
    else { setStatus('まだ書き出していません。「今すぐ更新する」で完成版を作成できます'); }
    return;
  }
  const video = document.getElementById('previewVideo');
  video.loop = false;    // お手本ループを解除
  const startAt = cards[i].start;
  playUntil = null;

  const jump = () => { video.currentTime = startAt; video.play().catch(() => {}); };

  if (showingFinal) {
    // 既に完成版を読み込み済みならネットワーク再取得なしで即ジャンプ
    if (video.readyState >= 1) jump();
    else video.addEventListener('loadedmetadata', jump, { once: true });
  } else {
    currentPlayingFile = null;
    showingFinal = true;
    video.src = `/api/final?t=${Date.now()}`;
    video.addEventListener('loadedmetadata', jump, { once: true });
  }
}

// ▶ 再生ボタン用: final.mp4のその区間だけ再生（効果音込みで確認できる）。
// k を渡すとカード内のそのサブクリップの区間だけ、省略時はカード全体を再生する。
function playCardFinal(i, k = null) {
  hideOverlayPreview();
  // 完成版が未書き出しなら、割り当て済み素材のその区間を代わりに再生する
  if (!finalExists) {
    if (cards[i].clips && cards[i].clips.length) { playSub(i, k ?? 0); }
    else { setStatus('素材を割り当ててから再生できます（通し確認は「今すぐ更新する」で書き出し後）'); }
    return;
  }
  const video = document.getElementById('previewVideo');
  video.loop = false;    // お手本ループを解除
  let startAt = cards[i].start;
  let endAt = cards[i].end;
  if (k != null) {
    // カード先頭からサブクリップkまでの尺を足した位置がkの開始位置
    const clips = cards[i].clips || [];
    let off = 0;
    for (let j = 0; j < k && j < clips.length; j++) off += (clips[j].duration || 0);
    startAt = cards[i].start + off;
    endAt = startAt + (clips[k] ? (clips[k].duration || 0) : 0);
  }
  playUntil = endAt;

  if (!showingFinal) {
    currentPlayingFile = null;
    showingFinal = true;
    video.src = `/api/final?t=${Date.now()}`;
  }

  // currentTimeはメタデータ読み込み済みなら即時・未読み込みならloadedmetadataで設定
  const seek = () => { video.currentTime = startAt; };
  if (video.readyState >= 1) {
    seek();
  } else {
    video.addEventListener('loadedmetadata', seek, { once: true });
  }
  // play()はクリックのコールスタック内で同期的に呼ぶ（自動再生制限を回避するため）
  video.play().catch(() => {});
}

document.addEventListener('keydown', e => {
  if (e.key === 's' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    saveTimeline();
  }
});

loadAll();
</script>
